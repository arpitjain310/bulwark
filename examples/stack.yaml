# Example declarative spec. Demonstrates the durable / ephemeral / protected
# distinction that drives rollback and teardown behavior.
version: 1
resources:
  - name: network
    type: vpc
    protection: durable      # kept on rollback, removed on teardown

  - name: database
    type: postgres
    depends_on: [network]
    protection: protected    # never deleted; a teardown that hits it aborts itself

  - name: cache
    type: redis
    depends_on: [network]    # ephemeral (default): torn down on rollback

  - name: app
    type: service
    depends_on: [database, cache]
